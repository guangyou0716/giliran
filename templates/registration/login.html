{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Staff login" %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{% translate "Staff login" %}</h1>
  {% if form.errors %}<p class="error" role="alert">{% translate "Wrong username or password." %}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label for="id_username">{% translate "Username" %}</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    <label for="id_password">{% translate "Password" %}</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">{% translate "Log in" %}</button>
  </form>
</section>
{% endblock %}
