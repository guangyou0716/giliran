name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            database: postgres
          - python-version: "3.12"
            database: sqlite
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: giliran
          POSTGRES_PASSWORD: giliran
          POSTGRES_DB: giliran
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U giliran"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Ubuntu mirrors on the runners time out now and then; retry instead of failing the job.
      - name: Install gettext (for compilemessages)
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends gettext
      - run: pip install -r requirements-dev.txt
      - name: Select database
        if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://giliran:giliran@localhost:5432/giliran" >> "$GITHUB_ENV"
      - run: python manage.py compilemessages --ignore=.venv
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: GILIRAN_DEMO_PASSWORD=ci-demo-pass python manage.py seed_demo
      - run: pytest -m "not e2e"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: giliran
          POSTGRES_PASSWORD: giliran
          POSTGRES_DB: giliran
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U giliran"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://giliran:giliran@localhost:5432/giliran
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e
        env:
          GILIRAN_SCREENSHOTS: test-results/screenshots
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
          retention-days: 7
